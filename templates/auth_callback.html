{% extends "base.html" %}
{% block title %}Completing Google Sign In — NEXORA{% endblock %}
{% block content %}

<div class="min-h-[calc(100vh-16rem)] flex items-center justify-center px-5 py-12">
  <div class="w-full max-w-md text-center">
    <div class="card p-8 sm:p-10 shadow-2xl">
      <div class="relative w-16 h-16 mx-auto mb-6 flex items-center justify-center">
        <!-- Spinning glow ring -->
        <div class="absolute inset-0 rounded-full border-4 border-indigo/20 border-t-indigo animate-spin"></div>
        <!-- Google Logo SVG -->
        <svg class="w-8 h-8" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.97 0 12s.45 3.84 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
      </div>

      <h1 class="font-display text-2xl font-bold text-navy tracking-tight" id="status-title">
        Authenticating with Google...
      </h1>
      <p class="text-sm text-ink/60 mt-2" id="status-subtitle">
        Securing your session and setting up your workspace.
      </p>

      <div id="error-box" class="hidden mt-6 p-4 rounded-xl bg-rose/10 border border-rose/30 text-rose text-sm text-left">
        <p class="font-semibold">Authentication Notice</p>
        <p id="error-message" class="text-ink/70 mt-1"></p>
        <div class="mt-3">
          <a href="{{ url_for('login') }}" class="btn btn-outline btn-sm">Return to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function handleAuthCallback() {
  const supabaseUrl = "{{ supabase_url }}";
  const supabaseAnonKey = "{{ supabase_anon_key }}";
  const statusTitle = document.getElementById('status-title');
  const statusSubtitle = document.getElementById('status-subtitle');
  const errorBox = document.getElementById('error-box');
  const errorMsg = document.getElementById('error-message');

  function showError(msg) {
    statusTitle.textContent = "Sign In Failed";
    statusSubtitle.textContent = "We encountered an issue during verification.";
    errorMsg.textContent = msg;
    errorBox.classList.remove('hidden');
  }

  try {
    // 1. Try parsing hash fragment first (access_token in implicit grant)
    const hash = window.location.hash.substring(1);
    const hashParams = new URLSearchParams(hash);
    const accessToken = hashParams.get('access_token');
    
    // 2. Also check URL query params
    const queryParams = new URLSearchParams(window.location.search);
    const errorParam = queryParams.get('error_description') || hashParams.get('error_description');

    if (errorParam) {
      showError(errorParam);
      return;
    }

    let userEmail = "";
    let userName = "";
    let userAvatar = "";

    if (accessToken) {
      // Decode JWT payload
      try {
        const payloadBase64 = accessToken.split('.')[1];
        const payloadStr = atob(payloadBase64.replace(/-/g, '+').replace(/_/g, '/'));
        const payload = JSON.parse(payloadStr);
        userEmail = payload.email || "";
        const meta = payload.user_metadata || {};
        userName = meta.full_name || meta.name || payload.email.split('@')[0];
        userAvatar = meta.avatar_url || meta.picture || "";
      } catch (e) {
        console.warn("JWT parse error, trying Supabase JS client:", e);
      }
    }

    // If Supabase JS client is available, verify session
    if ((!userEmail || !userName) && supabaseUrl && supabaseAnonKey && window.supabase) {
      try {
        const sb = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
        const { data: { session }, error } = await sb.auth.getSession();
        if (session && session.user) {
          userEmail = session.user.email;
          const meta = session.user.user_metadata || {};
          userName = meta.full_name || meta.name || userEmail.split('@')[0];
          userAvatar = meta.avatar_url || meta.picture || "";
        }
      } catch (err) {
        console.warn("Supabase client getSession error:", err);
      }
    }

    // If still no user, check demo fallback parameter
    if (!userEmail) {
      const demoEmail = queryParams.get('demo_email');
      if (demoEmail) {
        userEmail = demoEmail;
        userName = queryParams.get('demo_name') || "Google User";
      }
    }

    if (!userEmail) {
      showError("Could not retrieve user credentials from Google authentication callback.");
      return;
    }

    statusTitle.textContent = "Welcome, " + (userName.split(' ')[0] || "User") + "!";
    statusSubtitle.textContent = "Connecting your account and redirecting...";

    // Send profile to backend to establish server session
    const resp = await fetch("{{ url_for('api_auth_google_callback') }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: userEmail,
        name: userName,
        avatar: userAvatar,
      })
    });

    const result = await resp.json();
    if (result.ok && result.redirect) {
      window.location.href = result.redirect;
    } else {
      window.location.href = "{{ url_for('seeker_dashboard') }}";
    }

  } catch (err) {
    showError(err.message || "An unexpected error occurred during Google Sign In.");
  }
})();
</script>

{% endblock %}
